profile: qry-substrait-mapping-v0.3
substrait_target: logical-relations
status: normative-baseline
summary: >
  QRY v0.3 maps standard relational nodes to Substrait relation concepts.
  Sol-specific semantics are represented by declared extensions rather than
  by changing the meaning of standard relational nodes (spec 29.2). The
  profile is the documented mapping for gate condition 4; its content digest
  is recorded in mapping_digest.json.

supported_relations:
  read:
    substrait: ReadRel
    notes: Source schema, row metadata, and pinned-instance data (tuples / certified lower/upper) are QRY extensions used by bound inference.
  filter:
    substrait: FilterRel
    notes: Exact deterministic predicate terms map to Substrait expressions; selectivity annotations are QRY bound metadata.
  project:
    substrait: ProjectRel
    notes: Field references, literals, and exact deterministic computed columns.
  rename:
    substrait: ProjectRel
    notes: Field-name mapping only; row set unchanged.
  sort:
    substrait: SortRel
  limit:
    substrait: FetchRel
    notes: Position certainty requires an exact, deterministically ordered input (13.15); otherwise the result is labeled heuristic.
  distinct:
    substrait: AggregateRel
    notes: Logical uniqueness operator over declared keys.
  aggregate:
    substrait: AggregateRel
    notes: Group keys and aggregate functions; certified numeric intervals are QRY bound annotations (13.11-13.14).
  join:
    substrait: JoinRel
    notes: Inner joins over exact deterministic conditions map directly; non-inner joins leave certified sides unavailable in the v0.3 baseline.
  union_all:
    substrait: SetRel
    set_op: UNION
    notes: Bag union (11.2).
  union_distinct:
    substrait: SetRel
    set_op: UNION_DISTINCT
    notes: Set union (default set semantics, QINV-03).
  intersect:
    substrait: SetRel
    set_op: INTERSECT
  difference:
    substrait: SetRel
    set_op: MINUS
  annotate:
    substrait: ProjectRel
    notes: Exact deterministic column computation; row set unchanged.
  evaluate:
    substrait: ExtensionRel
    notes: Tuple-preserving semantic evaluator (barrier); certified positive sets and structural containment are QRY extensions (13.7.1).
  least_fixpoint:
    substrait: ExtensionRel
    notes: Positive recursive program; separate lower/upper least fixed points (13.10).
  temporal_slice:
    substrait: FilterRel
    notes: Valid-time predicate over an explicit time field (17).
  policy_boundary:
    substrait: ExtensionRel
    notes: Explicit policy-boundary marker; identity transfer; rewrites spanning it default to non-preserving (gate 16).

unsupported_in_v0_3:
  - window functions
  - correlated subqueries
  - arbitrary scalar functions
  - user-defined relations
  - embedded functions
  - physical relation variants

