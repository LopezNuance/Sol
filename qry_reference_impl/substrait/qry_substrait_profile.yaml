bound_annotations:
  guarantee: canonical guarantee kind (exact, lower_bound, upper_bound, bounded, heuristic)
  lower: certified lower relation (content-addressed object reference)
  upper: certified upper relation (content-addressed object reference)
  intervals: certified numeric intervals for aggregate results (13.11-13.14)
  assurance: assurance record with evidence and dependencies (13.3)
  provenance: lower-membership and upper-bound derivation provenance (12.5-12.9)
