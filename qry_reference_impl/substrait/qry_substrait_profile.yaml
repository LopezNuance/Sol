extension_areas:
  commit-pinned-sources: Commit-pinned sources
  commit-ancestry: Commit ancestry
  world-assumptions: World assumptions
  certified-answer-bounds: Certified answer bounds
  structural-one-sided-bounds: Structural one-sided bound rules
  assurance-evidence: Assurance evidence and dependencies
  bound-provenance: Lower-membership and upper-bound provenance contracts
  visibility-authorization: Visibility and authorization policy
  logical-disclosure: Logical-disclosure policy
  physical-side-channel: Physical side-channel policy
  valid-time: Valid time
  semantic-evaluator-barrier: Semantic evaluator barriers
  materialized-assessment: Materialized assessment relations
  positive-recursion: Positive recursive programs (least fixed point)
