default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: quality-fast
        name: quality fast
        entry: bash -c 'QUALITY_REPORT_DIR=.git/quality/pre-commit QUALITY_UPDATE_LATEST=0 scripts/quality.sh fast'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: quality-prepush
        name: quality prepush
        entry: bash -c 'QUALITY_REPORT_DIR=.git/quality/pre-push QUALITY_UPDATE_LATEST=0 scripts/quality.sh prepush'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
